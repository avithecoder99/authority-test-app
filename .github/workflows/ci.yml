name: ci
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - run: echo "${{ steps.push.outputs.digest }}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
  lambda:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package app/ as function.zip (fixed order and timestamps) and state its SHA-256
        run: |
          find app -name '*.py' -print | LC_ALL=C sort > files.txt
          xargs touch -d '2026-01-01T00:00:00Z' < files.txt
          zip -X -D -q function.zip -@ < files.txt
          echo "sha256:$(sha256sum function.zip | cut -d' ' -f1)" > lambda-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: function.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-digest
          path: lambda-digest.txt
